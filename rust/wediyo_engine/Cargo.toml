[package]
name = "wediyo_engine"
version = "0.1.0"
edition = "2021"
description = "Wediyo metadata engine — Rust core for Android (UniFFI)"
license = "MIT OR Apache-2.0"
keywords = ["youtube", "metadata", "android", "uniffi"]
categories = ["multimedia"]

[lib]
name = "wediyo_engine"
crate-type = ["cdylib", "staticlib", "rlib"]
path = "src/lib.rs"

[dependencies]
uniffi = { version = "0.28.3", features = ["cli"] }
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.41", features = ["rt", "macros", "rt-multi-thread"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
once_cell = "1.20"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"

[dev-dependencies]
uniffi = { version = "0.28.3", features = ["bindgen-tests"] }
