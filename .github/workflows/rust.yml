name: Rust — libs + UniFFI → commit

# This workflow builds the Rust metadata engine for Android and commits the
# outputs so the Android workflow can just USE them (no regen on every app change).
# Trigger only on Rust changes + manual.

on:
  push:
    branches: [main, master]
    paths:
      - "rust/**"
      - "rust-toolchain.toml"
      - ".github/workflows/rust.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "rust/**"
      - "rust-toolchain.toml"
  workflow_dispatch:

permissions:
  contents: write  # needed to commit bindings/libs back

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Set up Android SDK + NDK
        uses: android-actions/setup-android@v3

      - name: Install NDK 27 / platforms
        run: |
          sdkmanager "ndk;27.0.12077973" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Install cargo-ndk
        run: cargo install cargo-ndk --locked

      - name: Clippy + test (host)
        working-directory: rust
        run: |
          cargo clippy -p wediyo_engine -- -D warnings
          cargo test -p wediyo_engine

      - name: Cargo check android targets (minSdk 21)
        working-directory: rust
        run: |
          export CC_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang
          export CC_armv7_linux_androideabi=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang
          export CC_x86_64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang
          export CC_i686_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android21-clang
          export AR_aarch64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          export AR_armv7_linux_androideabi=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          export AR_x86_64_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          export AR_i686_linux_android=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar
          cargo check -p wediyo_engine --target aarch64-linux-android
          cargo check -p wediyo_engine --target armv7-linux-androideabi
          cargo check -p wediyo_engine --target x86_64-linux-android

      - name: Build Android libs via cargo-ndk
        working-directory: rust/wediyo_engine
        run: |
          cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 -o ../../app/src/main/jniLibs build --release
          ls -R ../../app/src/main/jniLibs
          file ../../app/src/main/jniLibs/arm64-v8a/libwediyo_engine.so
          file ../../app/src/main/jniLibs/armeabi-v7a/libwediyo_engine.so
          file ../../app/src/main/jniLibs/x86_64/libwediyo_engine.so

      - name: Generate UniFFI Kotlin bindings (committed)
        working-directory: rust/wediyo_engine
        run: |
          mkdir -p ../../app/src/main/kotlin/uniffi
          cargo run --bin uniffi-bindgen generate \
            --library ../../app/src/main/jniLibs/arm64-v8a/libwediyo_engine.so \
            --language kotlin \
            --out-dir ../../app/src/main/kotlin/uniffi
          ls -R ../../app/src/main/kotlin/uniffi
          echo "--- kotlin preview ---"
          head -n 120 ../../app/src/main/kotlin/uniffi/uniffi/wediyo_engine/wediyo_engine.kt || true

      - name: Commit libs + bindings if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/main/jniLibs/ app/src/main/kotlin/uniffi/ || true
          # Also add Cargo.lock if it changed (reproducibility)
          git add rust/Cargo.lock 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(rust): rebuild wediyo_engine libs + UniFFI bindings"
          git push

      - name: Upload artifacts (for PRs / inspection)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wediyo-rust-outputs
          path: |
            app/src/main/jniLibs/
            app/src/main/kotlin/uniffi/
