name: Android — APK (uses committed Go AAR)

# No Go build here. Uses AAR already committed by go.yml.

on:
  push:
    branches: [main, master]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradle.properties"
      - "settings.gradle.kts"
      - "build.gradle.kts"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "app/**"
      - "gradle/**"
  workflow_run:
    workflows: ["Go — AAR via gomobile → commit"]
    types: [completed]
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-apk:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install platforms
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Cache Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify committed Go AAR present
        run: |
          ls -lh app/libs/wediyo.aar || (echo "::error::Go AAR missing — did go.yml run?" && exit 1)
          unzip -l app/libs/wediyo.aar | head -n 20
          echo "AAR ok"

      - name: Assemble Debug (GH Action only — not local)
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: wediyo-debug-apk
          path: app/build/outputs/apk/debug/*.apk

  policy:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "✅ Local Gradle disabled — builds run only here."
          echo "Go AAR committed by go.yml → android.yml just consumes it."
          echo "Highly compatible: minSdk 21, target 35, NDK 27"

  prune-caches:
    runs-on: ubuntu-latest
    needs: build-apk
    if: always()
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Pruning caches — keep latest 20"
          # list caches sorted by created_at desc, keep 20, delete rest
          total=$(gh cache list --limit 100 --json id,createdAt --jq 'length' 2>/dev/null || echo 0)
          echo "Total caches: $total"
          if [ "$total" -gt 20 ]; then
            gh cache list --limit 100 --json id,createdAt --jq 'sort_by(.createdAt) | reverse | .[20:] | .[].id' 2>/dev/null | while read id; do
              if [ -n "$id" ] && [ "$id" != "null" ]; then
                echo "Deleting cache $id"
                gh cache delete "$id" --confirm 2>/dev/null || echo "failed $id"
              fi
            done
            echo "Prune done"
          else
            echo "No prune needed"
          fi
          # fallback: try API via gh api if cache list not supported
          if [ "$total" = "0" ]; then
            echo "Trying API fallback"
            curl -s -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/caches?per_page=100" | \
              jq -r '.actions_caches | sort_by(.created_at) | reverse | .[20:] | .[].id' | while read cid; do
                if [ -n "$cid" ] && [ "$cid" != "null" ]; then
                  echo "Deleting via API $cid"
                  curl -s -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
                    "https://api.github.com/repos/${{ github.repository }}/actions/caches/$cid" || true
                fi
              done
          fi
